  description: "RHOAI 3.5 Operations Workshop \u2014 A hands-on, day-2 operations lab\
    \ that walks platform administrators and MLOps engineers through operating Red Hat\
    \ OpenShift AI at scale: platform-as-code with GitOps and ACM, data stewardship and\
    \ RBAC, models and assets at scale, the upgrade lifecycle, observability, and backup/DR\
    \ with OADP. A follow-up to the RHOAI Deploy & Configure workshop."
  jira_ticket: none
  workflow_id: null
spec:
  title: RHOAI 3.5 Operations Workshop
  learning_objectives:
  - Describe the phoenix platform-as-code pattern and manage RHOAI with GitOps, app-of-apps, and ACM policy generation
  - Model a data-stewardship organization onto OpenShift groups, Data Science Projects, RoleBindings, and the RHOAI Auth CR
  - Configure MaaS permission tiers bound to groups and verify RBAC decisions as different personas
  - Build custom workbench images, ModelCar OCI containers, and register models in the model registry at scale
  - Plan RHOAI operator upgrades with OLM channels, dependent operator pinning, and pre-upgrade checklists
  - Observe the platform with RHOAI monitoring dashboards, PromQL metrics export, audit logs, and llm-d Perses dashboards
  - Protect RHOAI with OADP backups, namespace restore, and an understanding of the CRD dependency graph
  modules:
  - id: module-01
    title: Operations Guidelines and Patterns
    duration_min: 30
    status: complete
  - id: module-02
    title: Data Stewardship, Users & Access Control
    duration_min: 60
    status: complete
  - id: module-03
