approval_checklist:
  content:
    prerequisites_verifiable: null
    assessment_strategy: 'No automated assessment. Participants verify their own progress by observing CLI output, resource
      status conditions, and dashboard state at the end of each exercise.'
    catalog_gap: "This lab uniquely covers day-2 operations of Red Hat OpenShift AI at scale \u2014 platform-as-code with\
      \ GitOps/ACM, data-stewardship RBAC with persona walkthroughs, model/asset lifecycle at scale (workbench images, ModelCars,\
      \ model registry, Kueue), the RHOAI upgrade lifecycle with operator pinning, observability and metrics export, and\
      \ OADP-based backup/DR. Existing catalog items cover deploying and configuring RHOAI (the prerequisite workshop) or\
      \ MaaS consumption; none walk an operator through running the platform after deployment."
    design_overview: A day-2 RHOAI operations lab for advanced OCP platform administrators and MLOps engineers, run on a
      pre-provisioned RHOAI 3.5 cluster (deployed by the prerequisite Deploy & Configure workshop). Modules cover the phoenix
      platform-as-code pattern with GitOps and ACM, data-stewardship RBAC with persona-based access verification, model and
      asset management at scale, the operator upgrade lifecycle, monitoring/metrics/audit observability, and OADP backup
      and disaster recovery. GPU topics (Kueue scheduling, MIG/DRA, llm-d topologies) are covered conceptually \u2014 no GPU
      hardware is required.
    module_summaries:
    - title: 'Module 1: Operations Guidelines and Patterns'
      overview: Describe the phoenix platform-as-code pattern, GitOps trunk-based strategies, and the app-of-apps pattern;
        render and diff a dev/prod operator-install example and cover ACM, ACS, secrets management, and SOPs.
    - title: 'Module 2: Data Stewardship, Users & Access Control'
      overview: Model a data-stewardship organization onto OpenShift groups and projects; verify the pre-provisioned FreeIPA
        persona groups, configure the Auth CR, RoleBindings, and workbench roles, and prove RBAC with persona impersonation
        and MaaS permission tiers.
    - title: 'Module 3: Managing Models and Assets at Scale'
      overview: Build a custom workbench image and a ModelCar OCI container, register a model in the model registry, and
        cover Kueue GPU scheduling, MIG/DRA partitioning, and llm-d serving topologies conceptually.
    - title: 'Module 4: Upgrades'
      overview: Walk through the RHOAI release cadence and OLM subscription anatomy, audit dependent-operator channels and
        pinning, compare MaaS across 3.4/3.5/3.6, and build a pre-upgrade checklist \u2014 no actual upgrade is executed.
    - title: 'Module 5: Observe & Debug'
      overview: Explore the built-in RHOAI monitoring dashboards, query model serving metrics with PromQL, configure Prometheus
        remote-write export, read audit logs, and cover llm-d Perses dashboards and the planned MaaS metering architecture.
    - title: 'Module 6: Backups & Disaster Recovery'
      overview: Configure OADP with a NooBaa object bucket, back up and restore an RHOAI project namespace, and cover the
        etcd backup layer, the RHOAI CRD dependency graph, and product gaps framed as RFEs.
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []
